<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BR Screen v3</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; background: black; color: white; font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; }
        
        #main-display {
            height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 50px; box-sizing: border-box;
        }

        #current-text {
            font-size: 12vw; line-height: 1.1; text-transform: uppercase;
            transition: transform 0.1s;
        }

        /* Status Bar unten */
        .status-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #111;
            display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px;
            border-top: 4px solid #333; font-family: monospace; z-index: 100;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 1.2rem; color: #666; display: block; }
        .stat-val { font-size: 2.5rem; color: #0f0; }

        /* Video / Countdown */
        #video-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; display: none; }
        #countdown { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center;
            font-size: 30vw; color: #d00; 
        }
    </style>
</head>
<body>

    <div id="countdown">3</div>

    <div id="main-display">
        <div id="current-text">SYSTEM BEREIT</div>
    </div>

    <div id="video-layer">
        <video id="vPlayer" style="width:100%; height:100%"></video>
    </div>

    <div class="status-bar">
        <div class="stat-item"><span class="stat-label">SHOW</span><span class="stat-val" id="stShow">00:00:00</span></div>
        <div class="stat-item"><span class="stat-label">SONG</span><span class="stat-val" id="stSong" style="color:red">00:00</span></div>
        <div class="stat-item"><span class="stat-label">LINE</span><span class="stat-val" id="stLine" style="color:yellow">00:00</span></div>
    </div>

    <button id="start" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000;" onclick="init()">START SCREEN</button>

    <script>
            // --- FIREBASE CONFIG ---
     const firebaseConfig = {
  apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
  authDomain: "ardbr-2104b.firebaseapp.com",
  databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ardbr-2104b",
  storageBucket: "ardbr-2104b.firebasestorage.app",
  messagingSenderId: "1046269496627",
  appId: "1:1046269496627:web:cdbb0c26a8568d0ca98246",
  measurementId: "G-WNYTF03BX7"
};
        let db, scriptData = [], lineChangeTs = Date.now(), songTargetTs = null;

        function init() {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            document.getElementById('start').style.display = 'none';
            setup();
        }

        function setup() {
            db.ref('show/script').on('value', s => scriptData = s.val() || []);
            
            db.ref('show/line').on('value', s => {
                const idx = s.val();
                const item = scriptData[idx];
                if(item && item.type === 'text') {
                    document.getElementById('current-text').innerText = item.content;
                }
            });

            db.ref('show/lineChangeTs').on('value', s => lineChangeTs = s.val() || Date.now());

            db.ref('show/control').on('value', s => {
                const cmd = s.val();
                if(cmd?.action === 'start_sequence') {
                    songTargetTs = cmd.targetTime;
                    handleSongSync(cmd);
                }
                if(cmd?.action === 'stop') location.reload();
            });

            // Update Clocks
            setInterval(() => {
                // Line Clock
                const lSecs = Math.floor((Date.now() - lineChangeTs) / 1000);
                document.getElementById('stLine').innerText = formatTime(lSecs);

                // Song Clock (Countdown bis Start oder Elapsed)
                if(songTargetTs) {
                    const sDiff = Math.floor((Date.now() - songTargetTs) / 1000);
                    document.getElementById('stSong').innerText = formatTime(Math.abs(sDiff));
                }
            }, 1000);
        }

        function handleSongSync(cmd) {
            const cd = document.getElementById('countdown');
            cd.style.display = 'flex';
            const itv = setInterval(() => {
                const left = Math.ceil((cmd.targetTime - Date.now()) / 1000);
                cd.innerText = left > 0 ? left : "GO";
                if(left < 0) {
                    clearInterval(itv);
                    cd.style.display = 'none';
                    if(cmd.data.playback_video) {
                        const v = document.getElementById('vPlayer');
                        v.src = cmd.data.playback_video;
                        document.getElementById('video-layer').style.display = 'block';
                        v.play();
                    }
                }
            }, 100);
        }

        function formatTime(s) { return new Date(s * 1000).toISOString().substr(14, 5); }
    </script>
</body>
</html>
