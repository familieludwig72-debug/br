<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BR Master-Sync Pro</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root { --main-bg: #005591; --accent: #009ee3; --header-bg: #003a63; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #f4f7f9; height: 100vh; overflow: hidden; }
        
        /* Dynamisches Farbschema */
        .dynamic-theme { background-color: var(--main-bg) !important; }
        .dynamic-accent { background-color: var(--accent) !important; color: white; }
        .dynamic-header { background-color: var(--header-bg) !important; }

        /* Onboarding */
        #onboarding { position: fixed; inset: 0; background: var(--main-bg); display: flex; align-items: center; justify-content: center; z-index: 10000; color: white; }
        .setup-box { background: white; color: #333; padding: 30px; border-radius: 15px; width: 350px; text-align: center; }
        
        /* Regie UI */
        #regie-ui { display: none; height: 100vh; flex-direction: column; }
        .top-bar { padding: 15px 30px; color: white; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .current-info { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 5px; font-size: 0.9rem; }
        
        .main-content { display: grid; grid-template-columns: 350px 1fr 300px; gap: 20px; padding: 20px; height: 100%; box-sizing: border-box; }
        .panel { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow-y: auto; }
        
        /* Buttons & Form */
        .btn { border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        /* Sänger UI */
        #singer-ui { display: none; height: 100vh; background: #000; color: white; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .singer-status { font-size: 2rem; margin-top: 20px; text-transform: uppercase; letter-spacing: 3px; }
        
        #timer { font-family: monospace; font-size: 4rem; text-align: center; margin: 20px 0; }
        #video-player { position: fixed; inset: 0; background: black; display: none; z-index: 11000; }
    </style>
</head>
<body class="dynamic-theme">

    <div id="onboarding">
        <div class="setup-box">
            <img src="https://upload.wikimedia.org" width="80">
            <h3>System-Start</h3>
            <button class="btn dynamic-accent" onclick="initApp('regie')">KONSOLE (REGIE)</button>
            <button class="btn dynamic-accent" onclick="initApp('singer')">GERÄT (SÄNGER)</button>
        </div>
    </div>

    <div id="regie-ui">
        <div class="top-bar dynamic-header">
            <div>
                <strong id="active-show">KEINE SENDUNG GELADEN</strong>
                <div class="current-info">AKTIV: <span id="live-status">BEREITSCHAFT</span></div>
            </div>
            <div id="clock" style="font-family: monospace; font-size: 1.5rem;">00:00:00</div>
        </div>

        <div class="main-content">
            <!-- Config Management -->
            <div class="panel">
                <h4>Sende-Konfiguration</h4>
                <select id="config-load-select"><option>Lade Profile...</option></select>
                <button class="btn" style="background:#eee" onclick="loadSelectedConfig()">PROFIL LADEN</button>
                <hr>
                <input type="text" id="conf-name" placeholder="Name (z.B. Abendschau)">
                <input type="color" id="color1" value="#005591"> <small>Hauptfarbe</small>
                <input type="color" id="color2" value="#009ee3"> <small>Akzent</small>
                <input type="color" id="color3" value="#003a63"> <small>Header</small>
                <button class="btn dynamic-accent" onclick="saveConfig()">CONFIG SPEICHERN</button>
            </div>

            <!-- Steuerpult -->
            <div id="control-pult" class="panel">
                <h4>Matrix-Steuerung</h4>
                <div style="background:#f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <strong>VERSION A (Sänger Playback)</strong>
                    <input type="text" id="url_s" placeholder="URL Sänger (iPhone)">
                    <input type="text" id="url_p_a" placeholder="URL Publikum (Regie)">
                    <button class="btn dynamic-accent" onclick="fire(1, true)">START VIDEO</button>
                    <button class="btn" style="background:#444; color:white" onclick="fire(1, false)">START AUDIO</button>
                </div>
                <div style="background:#f9f9f9; padding: 15px; border-radius: 8px;">
                    <strong>VERSION B (Ohne Sänger Playback)</strong>
                    <input type="text" id="url_p_b" placeholder="URL Publikum (Regie)">
                    <button class="btn dynamic-accent" onclick="fire(2, true)">START VIDEO</button>
                </div>
                <button class="btn" style="background:#d7191c; color:white; margin-top:20px;" onclick="stop()">NOT-AUS</button>
            </div>

            <!-- Timer & Anzeige -->
            <div class="panel">
                <h4>Status</h4>
                <div id="timer">00:00.0</div>
                <div style="padding: 10px; background: #eefaff; border-radius: 5px;">
                    <strong>"Set me Free" (Sänger Exklusiv)</strong>
                    <input type="text" id="url_smf" placeholder="URL SMF">
                    <button class="btn dynamic-accent" onclick="fire(3, false)">SMF STARTEN</button>
                </div>
            </div>
        </div>
    </div>

    <div id="singer-ui">
        <div id="singer-indicator" style="width:120px; height:120px; border-radius:50%; border:5px solid var(--accent); display:flex; align-items:center; justify-content:center;">
            <img src="https://upload.wikimedia.org" width="60">
        </div>
        <div class="singer-status" id="s-label">OFFLINE</div>
        <div id="s-timer" style="font-family:monospace; font-size:2rem; margin-top:20px;">00:00.0</div>
    </div>

    <video id="video-player" playsinline></video>
    <audio id="audio-player" playsinline></audio>

    <script>
        const config = {
            apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
            databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ardbr-2104b"
        };
        firebase.initializeApp(config);
        const db = firebase.database();
        let role, offset = 0, tIdx;

        db.ref(".info/serverTimeOffset").on("value", s => offset = s.val());

        window.initApp = (r) => {
            role = r;
            document.getElementById('onboarding').style.display = 'none';
            if(r === 'regie') {
                document.getElementById('regie-ui').style.display = 'flex';
                loadConfigList();
            } else {
                document.getElementById('singer-ui').style.display = 'flex';
                if('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
            }
        };

        // --- CONFIG MANAGEMENT ---
        window.saveConfig = () => {
            const name = document.getElementById('conf-name').value || "Unbenannt";
            const data = {
                name,
                c1: document.getElementById('color1').value,
                c2: document.getElementById('color2').value,
                c3: document.getElementById('color3').value,
                url_s: document.getElementById('url_s').value,
                url_p_a: document.getElementById('url_p_a').value,
                url_p_b: document.getElementById('url_p_b').value,
                url_smf: document.getElementById('url_smf').value
            };
            db.ref('configs/' + name).set(data);
            alert("Gespeichert!");
        };

        function loadConfigList() {
            db.ref('configs').on('value', snap => {
                const select = document.getElementById('config-load-select');
                select.innerHTML = "";
                snap.forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c.key; opt.innerText = c.key;
                    select.appendChild(opt);
                });
            });
        }

        window.loadSelectedConfig = () => {
            const name = document.getElementById('config-load-select').value;
            db.ref('configs/' + name).once('value', snap => {
                const d = snap.val();
                document.getElementById('active-show').innerText = d.name.toUpperCase();
                document.documentElement.style.setProperty('--main-bg', d.c1);
                document.documentElement.style.setProperty('--accent', d.c2);
                document.documentElement.style.setProperty('--header-bg', d.c3);
                document.getElementById('url_s').value = d.url_s;
                document.getElementById('url_p_a').value = d.url_p_a;
                document.getElementById('url_p_b').value = d.url_p_b;
                document.getElementById('url_smf').value = d.url_smf;
                db.ref('active_theme').set({c1: d.c1, c2: d.c2, c3: d.c3});
            });
        };

        // Theme-Sync für Sänger
        db.ref('active_theme').on('value', snap => {
            if(!snap.val()) return;
            const d = snap.val();
            document.documentElement.style.setProperty('--main-bg', d.c1);
            document.documentElement.style.setProperty('--accent', d.c2);
            document.documentElement.style.setProperty('--header-bg', d.c3);
        });

        // --- PLAYBACK LOGIK ---
        window.fire = (v, vid) => {
            const start = Date.now() + offset + 1500;
            const payload = { 
                cmd: 'start', ver: v, vid, start,
                u_s: document.getElementById('url_s').value,
                u_pa: document.getElementById('url_p_a').value,
                u_pb: document.getElementById('url_p_b').value,
                u_smf: document.getElementById('url_smf').value
            };
            db.ref('sync').set(payload);
        };

        window.stop = () => db.ref('sync').update({ cmd: 'stop' });

        db.ref('sync').on('value', snap => {
            const d = snap.val();
            if(!d) return;
            if(d.cmd === 'start') {
                const wait = d.start - (Date.now() + offset);
                setTimeout(() => run(d), Math.max(0, wait));
            } else {
                halt();
            }
        });

        function run(d) {
            const vPlayer = document.getElementById('video-player');
            const aPlayer = document.getElementById('audio-player');
            let infoText = "";

            if(role === 'singer') {
                const url = (d.ver === 3) ? d.u_smf : (d.ver === 1 ? d.u_s : null);
                if(url) {
                    aPlayer.src = url; aPlayer.play();
                    document.getElementById('s-label').innerText = d.ver === 3 ? "SET ME FREE" : "PLAYBACK LIVE";
                }
            } else {
                const url = (d.ver === 1) ? d.u_pa : (d.ver === 2 ? d.u_pb : null);
                if(url) {
                    const t = d.vid ? vPlayer : aPlayer;
                    t.src = url; 
                    if(d.vid) { vPlayer.style.display='block'; if(vPlayer.requestFullscreen) vPlayer.requestFullscreen(); }
                    t.play();
                }
                document.getElementById('live-status').innerText = d.ver === 3 ? "SÄNGER SOLO (SMF)" : "PUBLIKUM LIVE (V" + d.ver + ")";
            }
            startTimer();
        }

        function halt() {
            const v = document.getElementById('video-player');
            const a = document.getElementById('audio-player');
            v.pause(); a.pause(); v.style.display='none';
            if(document.fullscreenElement) document.exitFullscreen();
            if(role === 'singer') document.getElementById('s-label').innerText = "BEREIT";
            else document.getElementById('live-status').innerText = "BEREITSCHAFT";
            clearInterval(tIdx);
        }

        function startTimer() {
            let s = Date.now();
            clearInterval(tIdx);
            tIdx = setInterval(() => {
                let d = (Date.now() - s) / 1000;
                let m = Math.floor(d/60).toString().padStart(2,'0') + ":" + (d%60).toFixed(1).padStart(4,'0');
                if(role === 'regie') document.getElementById('timer').innerText = m;
                else document.getElementById('s-timer').innerText = m;
            }, 100);
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE'); }, 1000);
    </script>
</body>
</html>
