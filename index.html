<!DOCTYPE html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Player</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
html,body{
  margin:0; width:100%; height:100%;
  background:black; color:white;
  overflow:hidden; font-family:sans-serif;
}
#screen{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
#logo{ width:40vw; max-width:300px }
button{ font-size:20px; padding:10px 20px; margin-top:20px }
video,audio{ display:none }
</style>
</head>
<body>

<div id="screen">
  <img id="logo" src="logo.png">
  <div id="buttons">
    <button onclick="setRole('sender')">🎬 Sender</button>
    <button onclick="setRole('receiver')">🔊 Empfänger</button>
  </div>
  <p id="hint">Tippe einmal, um Audio auf iOS zu aktivieren</p>
</div>

<video id="video" playsinline></video>
<audio id="audio" playsinline></audio>

<script>
// ===== Firebase =====
firebase.initializeApp({
  apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
  databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ardbr-2104b"
});
const db = firebase.database();

// ===== State =====
let role = null;
const video = document.getElementById("video");
const audio = document.getElementById("audio");

// ===== iOS Unlock Trick =====
function unlockAudio(){
  audio.src = "data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAA=="; // 0.1s silent
  audio.play().catch(()=>{});
}

// ===== Rolle setzen =====
function setRole(r){
  role = r;
  unlockAudio(); // wichtig für iPhone
  document.getElementById("buttons").remove();
  document.getElementById("hint").innerText =
    "Warte auf Startsignal...";
}

// ===== Firebase Listener =====
db.ref("session").on("value", snap=>{
  const s = snap.val();
  if(!s || s.state !== "play") return;

  const offset = (Date.now() - s.startTime)/1000;

  document.getElementById("screen").style.display="none";

  if(role === "sender"){
    video.src = s.senderVideo;
    video.style.display="block";
    video.currentTime = offset;
    video.play();
  }

  if(role === "receiver"){
    audio.src = s.receiverAudio;
    audio.currentTime = offset;
    audio.play();
  }
});

// ===== Sender Steuerung =====
document.addEventListener("keydown", e=>{
  if(role === "sender" && e.code === "Space"){
    db.ref("session").set({
      state: "play",
      startTime: Date.now(),
      senderVideo: "https://familieludwig72-debug.github.io/br/media/Fertige_Version_mp4.mp4",
      receiverAudio: "https://familieludwig72-debug.github.io/br/media/Playback_Instrumental.mp3"
    });
  }
});
</script>
</body>
</html>
