<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BR Studio Control | Final</title>
    <style>
        :root {
            --bg-color: #121212;
            --br-blue: #005293;
            --tally-red: #ff0000;
            --safe-green: #2ecc71;
            --warmup-orange: #e67e22;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- LAYOUT UTILS --- */
        .fullscreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hidden { display: none !important; }

        /* --- ONBOARDING --- */
        #onboarding {
            z-index: 1000;
            background: linear-gradient(135deg, #0b0b0b 0%, #1a1a1a 100%);
            flex-direction: column;
            text-align: center;
        }
        
        .role-btn {
            background: #333;
            border: 2px solid #555;
            color: white;
            padding: 20px 40px;
            font-size: 1.5rem;
            margin: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 250px;
        }
        .role-btn:hover { background: var(--br-blue); border-color: var(--br-blue); transform: scale(1.05); }

        /* --- STAGE (VIDEO/LOGO) --- */
        #stage-container {
            width: 100vw; 
            height: 100vh; 
            position: relative;
            background: black;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Tally Light Border (Roter Rahmen wenn Live) */
        #tally-border {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 0px solid var(--tally-red);
            pointer-events: none;
            z-index: 500;
            transition: border-width 0.1s;
        }
        .is-live #tally-border { border-width: 5px; }

        /* Logo Overlay */
        #logo-overlay {
            background: black;
            z-index: 100;
            flex-direction: column;
            transition: opacity 0.3s ease-out;
        }
        
        #client-status-text {
            margin-top: 20px;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #888;
        }
        
        .blink { animation: blinker 2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }

        /* --- MASTER CONTROL UI (Unten) --- */
        #master-controls {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            height: 140px;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid #333;
            z-index: 600;
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            padding: 0 20px;
            box-sizing: border-box;
            align-items: center;
        }

        .control-group { display: flex; gap: 10px; justify-content: center; }

        /* Track Selectors */
        .track-btn {
            background: #222; border: 1px solid #444; color: #aaa;
            padding: 10px 15px; border-radius: 4px; cursor: pointer;
        }
        .track-btn.active { background: var(--br-blue); color: white; border-color: var(--br-blue); }

        /* Main Transport Buttons */
        .transport-btn {
            height: 60px;
            padding: 0 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-play { background: var(--safe-green); color: black; }
        .btn-stop { background: var(--tally-red); color: white; }
        .btn-warmup { background: var(--warmup-orange); color: white; font-size: 1rem;}
        
        /* Timecode */
        #timecode {
            font-family: monospace;
            font-size: 2rem;
            color: var(--tally-red);
            text-align: center;
            background: black;
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Mini Info */
        .info-label { font-size: 0.7rem; color: #666; text-transform: uppercase; margin-bottom: 5px; display:block;}

    </style>
</head>
<body>

    <div id="onboarding" class="fullscreen">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Bayerischer_Rundfunk_202x_logo.svg/300px-Bayerischer_Rundfunk_202x_logo.svg.png" alt="BR Logo" style="margin-bottom: 40px; opacity: 0.8;">
        <h2 style="margin-bottom: 30px; font-weight: 300;">STUDIO SYNC SYSTEM</h2>
        
        <button class="role-btn" onclick="initApp('master')">
            <div>💻 REGIE</div>
            <div style="font-size: 0.8rem; margin-top:5px; opacity:0.6;">Steuerung & Video-Feed</div>
        </button>
        
        <button class="role-btn" onclick="initApp('client')">
            <div>🎤 SÄNGER / CLIENT</div>
            <div style="font-size: 0.8rem; margin-top:5px; opacity:0.6;">Playback & Status</div>
        </button>
    </div>

    <div id="stage-container">
        <div id="tally-border"></div>

        <div id="logo-overlay" class="fullscreen">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Bayerischer_Rundfunk_202x_logo.svg/400px-Bayerischer_Rundfunk_202x_logo.svg.png" style="opacity: 0.7;">
            <div id="client-status-text">BEREIT</div>
        </div>

        <video id="main-video" playsinline preload="auto"></video>
        
        <audio id="main-audio" preload="auto"></audio>

        <audio id="warmup-audio" preload="auto" loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mp3">
        </audio>
    </div>

    <div id="master-controls" class="hidden">
        
        <div>
            <span class="info-label">Playlist Auswahl</span>
            <div style="display: flex; gap: 5px;">
                <button class="track-btn active" id="btn-track-0" onclick="selectTrack(0)">1. Intro</button>
                <button class="track-btn" id="btn-track-1" onclick="selectTrack(1)">2. Ballade</button>
                <button class="track-btn" id="btn-track-2" onclick="selectTrack(2)">3. Finale</button>
            </div>
            <div style="font-size: 0.7rem; color: #555; margin-top: 5px;">Tasten: 1, 2, 3</div>
        </div>

        <div class="control-group">
            <button class="transport-btn btn-warmup" onclick="sendCommand('warmup')">Warm-Up (W)</button>
            <button class="transport-btn btn-play" onclick="togglePlay()">START (Space)</button>
            <button class="transport-btn btn-stop" onclick="sendCommand('stop')">STOP</button>
        </div>

        <div style="text-align: right;">
            <span class="info-label">Laufzeit</span>
            <div id="timecode">00:00</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // --- KONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
            databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ardbr-2104b"
        };

        // --- PLAYLIST CONFIG (Hier deine Links eintragen) ---
        const playlist = [
            { 
                name: "Intro",
                vid: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", 
                aud: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
            },
            { 
                name: "Ballade",
                vid: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", 
                aud: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" 
            },
            { 
                name: "Finale",
                vid: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", 
                aud: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" 
            }
        ];

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State Vars
        let role = null;
        let currentTrackIndex = 0;
        let isPlaying = false;
        let updateTimer = null; // Für Timecode

        // DOM Elements
        const els = {
            onboarding: document.getElementById('onboarding'),
            controls: document.getElementById('master-controls'),
            video: document.getElementById('main-video'),
            audio: document.getElementById('main-audio'),
            warmup: document.getElementById('warmup-audio'),
            logo: document.getElementById('logo-overlay'),
            statusText: document.getElementById('client-status-text'),
            tally: document.getElementById('stage-container'),
            timecode: document.getElementById('timecode'),
            trackBtns: [
                document.getElementById('btn-track-0'),
                document.getElementById('btn-track-1'),
                document.getElementById('btn-track-2')
            ]
        };

        // --- INITIALISIERUNG ---
        window.initApp = (selectedRole) => {
            role = selectedRole;
            els.onboarding.classList.add('hidden');

            // Media Unlock Hack für iOS
            [els.video, els.audio, els.warmup].forEach(media => {
                media.play().catch(()=>{}); 
                media.pause();
                media.currentTime = 0;
            });

            // Vorladen des ersten Tracks
            loadTrack(0);

            if (role === 'master') {
                els.controls.classList.remove('hidden');
                els.video.muted = true; // Master ist immer Muted um Feedback zu vermeiden
                setupKeys();
            } else {
                els.video.style.display = 'none'; // Client braucht kein Video
                els.audio.volume = 1.0;
                els.warmup.volume = 1.0;
            }

            // Start Sync Listener
            listenToState();
        };

        // --- TRACK MANAGEMENT ---
        window.selectTrack = (index) => {
            if (role !== 'master') return;
            // Wenn wir den Track wechseln, senden wir erstmal STOP, dann laden wir den neuen
            sendCommand('stop');
            
            // Kleines Timeout damit DB sich beruhigt, dann Track setzen
            setTimeout(() => {
                // Wir speichern den Track Index auch in der DB, 
                // aber hier machen wir es simpel: Playlist muss auf allen Geräten gleich sein.
                // Wir senden "prepare" command
                set(ref(db, 'session/state'), {
                    mode: 'prepare',
                    trackIndex: index,
                    timestamp: serverTimestamp()
                });
            }, 200);
        };

        function loadTrack(index) {
            if (!playlist[index]) return;
            currentTrackIndex = index;
            
            // Update UI Buttons
            if (role === 'master') {
                els.trackBtns.forEach((btn, i) => {
                    btn.classList.toggle('active', i === index);
                });
            }

            // Setzen der Quellen
            els.video.src = playlist[index].vid;
            els.audio.src = playlist[index].aud;
            
            // Preload triggers
            els.video.load();
            els.audio.load();
        }

        // --- MASTER COMMANDS ---
        window.sendCommand = (mode) => {
            const delay = 500; // 500ms Puffer für Netzwerk
            set(ref(db, 'session/state'), {
                mode: mode,
                trackIndex: currentTrackIndex,
                startTime: Date.now() + delay,
                timestamp: serverTimestamp()
            });
        };

        window.togglePlay = () => {
            // Check current visual state (simple toggle)
            if (els.logo.style.opacity === '0') {
                sendCommand('stop');
            } else {
                sendCommand('play');
            }
        };

        function setupKeys() {
            document.addEventListener('keydown', (e) => {
                if(e.repeat) return;
                switch(e.key) {
                    case ' ': e.preventDefault(); togglePlay(); break;
                    case '1': selectTrack(0); break;
                    case '2': selectTrack(1); break;
                    case '3': selectTrack(2); break;
                    case 'w': case 'W': sendCommand('warmup'); break;
                }
            });
        }

        // --- SYNC ENGINE ---
        function listenToState() {
            onValue(ref(db, 'session/state'), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // 1. Track laden falls geändert
                if (data.trackIndex !== undefined && data.trackIndex !== currentTrackIndex) {
                    loadTrack(data.trackIndex);
                }

                // 2. Modus ausführen
                const now = Date.now();
                const waitTime = data.startTime - now;

                // Stop any previous timers
                clearTimeout(window.syncTimer);

                if (data.mode === 'stop' || data.mode === 'prepare') {
                    executeStop(data.mode);
                    return;
                }

                // Helper function to execute play
                const doPlay = () => {
                    if (data.mode === 'warmup') executeWarmup();
                    if (data.mode === 'play') executePlay(now, data.startTime);
                };

                if (waitTime > 0) {
                    window.syncTimer = setTimeout(doPlay, waitTime);
                } else {
                    doPlay(); // Late join
                }
            });
        }

        // --- EXECUTION LOGIC ---

        function executeStop(mode) {
            isPlaying = false;
            els.tally.classList.remove('is-live'); // Roter Rahmen weg
            
            els.video.pause(); els.video.currentTime = 0;
            els.audio.pause(); els.audio.currentTime = 0;
            els.warmup.pause(); els.warmup.currentTime = 0;

            els.logo.style.opacity = '1';
            
            let status = (mode === 'prepare') ? `LADE TRACK ${currentTrackIndex + 1}...` : "BEREIT";
            els.statusText.innerText = status;
            els.statusText.classList.remove('blink');
            
            stopTimecode();
        }

        function executeWarmup() {
            isPlaying = false; // Video spielt nicht
            els.tally.classList.remove('is-live');

            els.video.pause();
            els.audio.pause(); // Show Audio aus
            
            // Warmup Audio Loop an
            if (role === 'client') {
                els.warmup.play();
                els.statusText.innerText = "♫ WARM-UP ♫";
                els.statusText.classList.add('blink');
            } else {
                els.statusText.innerText = "WARM-UP (Sänger hört Audio)";
            }
            els.logo.style.opacity = '1'; // Logo sichtbar lassen
        }

        function executePlay(now, startTime) {
            isPlaying = true;
            els.tally.classList.add('is-live'); // Roter Rahmen an!
            els.warmup.pause(); // Warmup aus
            
            els.logo.style.opacity = '0'; // Video enthüllen
            els.statusText.classList.remove('blink');

            // Sync Calculation
            let offset = (Date.now() - startTime) / 1000;
            if (offset < 0) offset = 0;

            if (role === 'master') {
                els.video.currentTime = offset;
                els.video.play();
                startTimecode();
            } else if (role === 'client') {
                els.audio.currentTime = offset;
                els.audio.play();
            }
        }

        // --- TIMECODE HELPER ---
        function startTimecode() {
            stopTimecode();
            updateTimer = setInterval(() => {
                if (!els.video) return;
                const secs = Math.floor(els.video.currentTime);
                const m = Math.floor(secs / 60).toString().padStart(2, '0');
                const s = (secs % 60).toString().padStart(2, '0');
                els.timecode.innerText = `${m}:${s}`;
            }, 500);
        }

        function stopTimecode() {
            clearInterval(updateTimer);
            els.timecode.innerText = "00:00";
        }

    </script>
</body>
</html>
