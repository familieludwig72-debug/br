<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sänger In-Ear</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        
        .box { border: 2px solid #444; padding: 20px; border-radius: 10px; text-align: center; width: 80%; }
        .box.live { border-color: #0f0; box-shadow: 0 0 20px #0f0; background: #002200; }
        
        h1 { margin:0; color:#888; font-size: 1rem; }
        #song { font-size: 2rem; font-weight: bold; margin: 10px 0; }
        
        #btn-start { padding: 20px 40px; background: #d00; border: none; color: white; font-size: 1.5rem; border-radius: 50px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <button id="btn-start" onclick="connect()">VERBINDEN</button>

    <div id="ui" class="hidden" style="width:100%; display:flex; justify-content:center;">
        <div class="box" id="statusBox">
            <h1>STATUS</h1>
            <div id="song">Warten...</div>
            <div id="timer" style="font-family:monospace; font-size:1.5rem;">--:--</div>
        </div>
    </div>

    <audio id="earAudio" preload="auto"></audio>
    <div id="preload-area" style="display:none;"></div>

    <script>
        // --- FIREBASE CONFIG ---
     const firebaseConfig = {
  apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
  authDomain: "ardbr-2104b.firebaseapp.com",
  databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ardbr-2104b",
  storageBucket: "ardbr-2104b.firebasestorage.app",
  messagingSenderId: "1046269496627",
  appId: "1:1046269496627:web:cdbb0c26a8568d0ca98246",
  measurementId: "G-WNYTF03BX7"
};
        let db;
        const audio = document.getElementById('earAudio');
        const ui = document.getElementById('ui');
        const box = document.getElementById('statusBox');

        function connect() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.database();

            // iOS Unlock
            audio.play().catch(e=>{}); audio.pause();

            document.getElementById('btn-start').classList.add('hidden');
            ui.classList.remove('hidden');

            // Listeners
            db.ref('show/control').on('value', snap => {
                const cmd = snap.val();
                if(!cmd) return;

                if(cmd.action === 'stop') {
                    audio.pause(); 
                    box.classList.remove('live');
                    document.getElementById('song').innerText = "STOP";
                }
                else if(cmd.action === 'start_sequence') {
                    handleSyncStart(cmd.targetTime, cmd.data);
                }
            });

            // Preloader Logik auch hier (für schnelle Reaktion)
            db.ref('show/script').once('value', snap => {
                const data = snap.val() || [];
                const preloadArea = document.getElementById('preload-area');
                data.forEach(item => {
                    if(item.type === 'music' && item.singer_audio) {
                        const a = new Audio();
                        a.src = item.singer_audio;
                        a.preload = "auto"; // Zwingt Browser zum Cachen
                    }
                });
            });
        }

        function handleSyncStart(targetTime, data) {
            document.getElementById('song').innerText = data.name;
            
            const now = Date.now();
            const wait = targetTime - now;

            if(wait > 0) {
                // Countdown Phase
                document.getElementById('song').innerText = "GET READY...";
                setTimeout(() => {
                    startAudio(data);
                }, wait);
            } else {
                startAudio(data);
            }
        }

        function startAudio(data) {
            if(data.singer_audio) {
                audio.src = data.singer_audio;
                audio.currentTime = 0;
                audio.play();
                box.classList.add('live');
                document.getElementById('song').innerText = data.name;
            } else {
                document.getElementById('song').innerText = "Kein In-Ear File";
            }
        }
    </script>
</body>
</html>
