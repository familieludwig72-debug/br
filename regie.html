<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>BR Regie Master PRO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #ffcc00; --bg: #0a0a0a; --panel: #1a1a1a; --text-dim: #555; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Inter', -apple-system, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar: Clean & Professional */
        .sidebar { width: 300px; background: var(--panel); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .music-shelf { flex: 1; overflow-y: auto; margin-top: 20px; }
        .song-card { background: #252525; padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border-left: 4px solid #ff4444; transition: 0.2s; font-size: 0.9rem; }
        .song-card:hover { background: #333; transform: translateX(5px); }

        /* Main View */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .top-bar { height: 180px; display: flex; background: #000; border-bottom: 1px solid #333; align-items: center; }
        #preview-box { width: 320px; height: 180px; background: #000; border-right: 1px solid #333; }
        .timer-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 30px; }
        .timer-item { text-align: center; }
        .timer-val { font-family: 'Courier New', monospace; font-size: 2.8rem; color: var(--accent); display: block; letter-spacing: -1px; }
        .timer-label { font-size: 0.7rem; color: #777; text-transform: uppercase; font-weight: bold; }

        /* Script Window: Der Fokus-Effekt */
        #script-container { flex: 1; overflow-y: scroll; padding: 40vh 0; scroll-behavior: smooth; background: var(--bg); position: relative; }
        #script-container::-webkit-scrollbar { display: none; }

        .script-line { 
            padding: 20px 10%; font-size: 2.2rem; text-align: center; line-height: 1.4;
            transition: all 0.3s ease; opacity: 0.1; color: #fff;
        }

        /* Status-Klassen für saubere Optik */
        .script-line.active { opacity: 1; color: var(--accent); font-weight: 800; transform: scale(1.05); }
        .script-line.near { opacity: 0.4; color: #ccc; }
        
        .music-cue-line { color: #ff4444 !important; font-size: 1.4rem; font-weight: bold; border-top: 1px solid #333; border-bottom: 1px solid #333; margin: 40px 0; padding: 10px; }

        .btn-main { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-stop { background: #ff4444; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="margin-bottom: 20px; font-weight: 900; letter-spacing: 2px; color: var(--accent);">BROADCAST ENGINE</div>
        <input type="file" id="fileInput" hidden onchange="processScript()">
        <button class="btn-main" onclick="document.getElementById('fileInput').click()"><i class="fas fa-file-upload"></i> SKRIPT IMPORTIEREN</button>
        
        <div class="music-shelf" id="musicShelf"></div>
        <button class="btn-stop" onclick="stopAll()"><i class="fas fa-power-off"></i> GLOBAL STOP</button>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div id="preview-box">
                <video id="regieVideo" style="width:100%; height:100%; object-fit: cover;" muted></video>
            </div>
            <div class="timer-grid">
                <div class="timer-item"><span class="timer-label">Total Time</span><span class="timer-val" id="showTimer">00:00</span></div>
                <div class="timer-item"><span class="timer-label">Line Time</span><span class="timer-val" id="lineTimer">00:00</span></div>
                <div class="timer-item"><span class="timer-label">Status</span><span class="timer-val" id="statusInfo" style="font-size: 1.5rem; margin-top: 10px;">READY</span></div>
            </div>
        </div>

        <div id="script-container">
            <div id="script-inner"></div>
        </div>
    </div>

    <script>
        // FIREBASE INITIALISIERUNG
         // --- FIREBASE CONFIG ---
     const firebaseConfig = {
  apiKey: "AIzaSyDO52wApLEslVgfB5Y2TdzY5rPivOUEzBQ",
  authDomain: "ardbr-2104b.firebaseapp.com",
  databaseURL: "https://ardbr-2104b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ardbr-2104b",
  storageBucket: "ardbr-2104b.firebasestorage.app",
  messagingSenderId: "1046269496627",
  appId: "1:1046269496627:web:cdbb0c26a8568d0ca98246",
  measurementId: "G-WNYTF03BX7"
};
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let scriptData = [];
        let currentIndex = 0;
        let startTime = Date.now();
        let lineStartTime = Date.now();

        // Zeit-Loop für die Anzeige
        setInterval(() => {
            const diff = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('showTimer').innerText = new Date(diff * 1000).toISOString().substr(14, 5);
            const lDiff = Math.floor((Date.now() - lineStartTime) / 1000);
            document.getElementById('lineTimer').innerText = new Date(lDiff * 1000).toISOString().substr(14, 5);
        }, 1000);

        async function processScript() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;
            
            const text = await file.text();
            const rawLines = text.split('\n');
            scriptData = [];
            
            const shelf = document.getElementById('musicShelf');
            shelf.innerHTML = '<div style="font-size:0.7rem; color:#777; margin-bottom:10px;">JUKEBOX</div>';

            rawLines.forEach((l, i) => {
                const line = l.trim();
                if(!line) return;

                if(line.startsWith('(Music:')) {
                    const clean = line.replace('(Music:', '').replace(')', '');
                    const p = clean.split(';');
                    const song = {
                        type: 'music',
                        id: i,
                        name: (p[0] || "Unbekannter Song").trim(),
                        duration: (p[1] || "0").trim(),
                        playback_audio: getUrl(p[2]) || "",
                        instrumental_audio: getUrl(p[3]) || "",
                        playback_video: getUrl(p[4]) || "",
                        instrumental_video: getUrl(p[5]) || "",
                        singer_audio: getUrl(p[6]) || ""
                    };
                    scriptData.push(song);
                    
                    const div = document.createElement('div');
                    div.className = 'song-card';
                    div.innerHTML = `<i class="fas fa-music"></i> <b>${song.name}</b>`;
                    div.onclick = () => fireMusic(song, i);
                    shelf.appendChild(div);
                } else {
                    scriptData.push({ type: 'text', id: i, content: line });
                }
            });

            // WICHTIG: Sende bereinigte Daten zu Firebase (keine undefined)
            db.ref('show/script').set(JSON.parse(JSON.stringify(scriptData)));
            renderScript();
            selectLine(0);
        }

        function getUrl(s) {
            if(!s) return "";
            const m = s.match(/"([^"]+)"/);
            return m ? m[1] : "";
        }

        function renderScript() {
            const container = document.getElementById('script-inner');
            container.innerHTML = '';
            scriptData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.id = 'line-' + idx;
                div.className = item.type === 'text' ? 'script-line' : 'script-line music-cue-line';
                div.innerText = item.type === 'text' ? item.content : `--- SONG: ${item.name} ---`;
                div.onclick = () => selectLine(idx);
                container.appendChild(div);
            });
        }

        function selectLine(idx) {
            if(idx < 0 || idx >= scriptData.length) return;
            currentIndex = idx;
            lineStartTime = Date.now();
            
            db.ref('show/line').set(idx);
            db.ref('show/lineChangeTs').set(firebase.database.ServerValue.TIMESTAMP);

            document.querySelectorAll('.script-line').forEach((el, i) => {
                el.classList.remove('active', 'near');
                if(i === idx) el.classList.add('active');
                else if(Math.abs(i - idx) <= 2) el.classList.add('near');
            });

            document.getElementById('line-' + idx)?.scrollIntoView({behavior:'smooth', block:'center'});
        }

        function fireMusic(song, idx) {
            const targetTime = Date.now() + 3000;
            // Bereinigen vor dem Senden
            const cleanSong = JSON.parse(JSON.stringify(song));
            db.ref('show/control').set({ action:'start_sequence', targetTime, data: cleanSong });
            document.getElementById('statusInfo').innerText = "LIVE: " + song.name;
            selectLine(idx);
            
            if(song.playback_video) {
                const vid = document.getElementById('regieVideo');
                vid.src = song.playback_video;
                setTimeout(() => vid.play(), 3000);
            }
        }

        function stopAll() { 
            db.ref('show/control').set({ action: 'stop' });
            location.reload(); 
        }

        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowDown') { e.preventDefault(); selectLine(currentIndex + 1); }
            if(e.key === 'ArrowUp') { e.preventDefault(); selectLine(currentIndex - 1); }
        });
    </script>
</body>
</html>
